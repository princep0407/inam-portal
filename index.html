<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inam Vitran – Balmandal Portal</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1a1f;--mut:#6f6a72;--line:#e7e2dc;--pri:#7a1f4a;--pri2:#5a1236;--acc:#c8963e;--ok:#13a05b;--okbg:#e6f6ee;--warn:#d9822b;--warnbg:#fdf0e1;--r:14px;--sh:0 1px 2px rgba(30,20,30,.06),0 8px 24px rgba(30,20,30,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141116;--card:#1e1a21;--ink:#f1edf3;--mut:#a59ead;--line:#332d38;--pri:#d0679a;--pri2:#e58ab6;--okbg:#12301f;--warnbg:#3a2a14;--sh:0 1px 2px #0006}}
:root[data-theme=dark]{--bg:#141116;--card:#1e1a21;--ink:#f1edf3;--mut:#a59ead;--line:#332d38;--pri:#d0679a;--pri2:#e58ab6;--okbg:#12301f;--warnbg:#3a2a14;--sh:0 1px 2px #0006}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Roboto,"Noto Sans Gujarati",Arial,sans-serif;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
button:hover{border-color:var(--pri)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent);outline-offset:1px}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}.pri:hover{background:var(--pri2)}
.wa{background:var(--ok);border-color:var(--ok);color:#fff}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--pri) 22%,transparent),transparent),radial-gradient(700px 400px at 100% 110%,color-mix(in srgb,var(--acc) 25%,transparent),transparent)}
.lc{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;box-shadow:var(--sh)}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--acc));display:grid;place-items:center;font-size:26px;margin-bottom:14px}
.lc h1{margin:0 0 4px;font-size:22px}.lc p{margin:0 0 20px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.err{color:#d23b4b;font-size:13px;min-height:18px;margin-top:10px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top>div{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand .logo{width:36px;height:36px;font-size:18px;margin:0;border-radius:10px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;color:var(--mut)}.tabs button.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.stat b{font-size:28px;display:block;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;display:flex}.bar i{background:var(--ok);display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:180px}.tools select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.mrow{display:grid;grid-template-columns:1.4fr 2fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}.mrow b{display:block}.mrow small{color:var(--mut)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;background:var(--warnbg);color:var(--warn)}.pill.s{background:var(--okbg);color:var(--ok)}
.st{margin:18px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px 12px}
.row.sent{border-left-color:var(--ok)}.row small{color:var(--mut);display:block}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts input{width:150px;padding:7px 10px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
textarea{min-height:360px;line-height:1.5}
.prev{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
dialog{border:0;border-radius:16px;padding:0;max-width:min(94vw,520px);width:100%;background:var(--card);color:var(--ink)}
dialog img{width:100%;display:block}dialog .acts{padding:12px}dialog::backdrop{background:rgba(20,8,16,.6)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99}
.sync{font-size:12px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:5px}.dot.on{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
@media(max-width:720px){.two{grid-template-columns:1fr}.mrow{grid-template-columns:1fr auto}.mrow .bar{grid-column:1/-1;order:3}}
.fmt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.fmt button{padding:6px 11px;min-width:38px;justify-content:center}
.bubble{background:#dcf8c6;color:#111;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;max-height:420px;overflow:auto;word-break:break-word}.bubble code{font-family:monospace;background:#0001;padding:0 3px;border-radius:4px}
:root[data-theme=dark] .bubble{background:#0b5c4b;color:#eee}
@media(max-width:600px){body{font-size:14px}input,select,textarea{font-size:16px}.wrap{padding:12px 10px 80px}.top{padding-left:10px;padding-right:10px}.brand small{font-size:11px}
.grid{grid-template-columns:repeat(2,1fr)}.stat b{font-size:24px}.tools>*{flex:1 1 100%}.seg{width:100%}.seg button{flex:1;justify-content:center}
.acts input{width:100%;flex:1 1 100%}.acts button,.acts a{flex:1 1 calc(50% - 6px);justify-content:center}textarea{min-height:260px}.card{padding:14px}.lc{padding:26px 20px}.sync{font-size:11px}}
</style></head><body>
